spring.application.name=backend

#[.properties] lets spring know that the file should be treated as a .properties file not another config format
#change .env.development to .env.production if needed
spring.config.import=optional:file:./.env.development[.properties]

#dev profile, .env.development will be used
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#database properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#dev only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.sql.init.mode=never

#security
#Means: set jjwt.secret to JWT_SECRET (ENV VAR)
jjb.jwt.secret=${JWT_SECRET}
jjb.jwt.access-mins=${JWT_ACCESS_MINS}
jjb.jwt.refresh-days=${JWT_REFRESH_DAYS}

#cors
jjb.allowed-origins=${ALLOWED_ORIGINS}

#app specific properties
jjb.card.expiry-years=3
jjb.transaction.expiry-days=1/24

#Spring Mail and SMTP properties
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Frontend
jjb.frontend.base.url=${FRONTEND_BASE_URL}
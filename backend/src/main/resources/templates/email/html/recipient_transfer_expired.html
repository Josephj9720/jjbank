<!DOCTYPE html>
<html>
    <head>
        <style>

            /* Base */
            .body-text {
                font-size: 16px;
                line-height: 1.5;
            }

            .secondary-text {
                font-size: 14px;
                line-height: 1.4;
            }

            .small-text {
                font-size: 13px;
                line-height: 1.4;
                color: #666666;
            }

            .heading {
                font-size: 22px;
                font-weight: bold;
            }

            /* Mobile */
            @media only screen and (max-width: 600px) {

                .body-text {
                    font-size: 14px !important;
                }

                .secondary-text {
                    font-size: 13px !important;
                }

                .heading {
                    font-size: 18px !important;
                }
            }

        </style>
    </head>
    <body style="margin:0; padding:0; background-color:#DCE8F9; font-family:Arial, Helvetica, sans-serif;">
        <table style="width:100%; padding:20px;">
            <tr>
                <td align="center">
                    <!-- Main Card -->
                    <table style="width: 100%; max-width:600px; background-color:#ffffff; border-radius: 12px; padding:32px;">
                        <!-- Header -->
                        <tr>
                            <td class="heading" style="text-align:center; font-size:22px; font-weight:bold; color:#0B1215">
                                JJBank
                            </td>
                        </tr>
                        <!-- Body -->
                        <tr>
                            <td class="body-text" style="padding-top:16px; font-size:16px; color:#0B1215;">
                                Hello <span th:text="${recipient}">Recipient</span>,
                                <br><br>
                                Your transfer from <span th:text="${sender}">Sender</span> has expired.
                            </td>
                        </tr>
                        <!-- Transaction Box -->
                        <!-- spacing -->
                        <tr>
                            <!-- use &nbsp non-breaking space for empty cell to show -->
                            <td style="font-size:14px; color:#0B1215;">&nbsp;</td>
                        </tr>
                        <tr>
                            <td style="padding-top:16px">
                                <table style="width:100%; background-color:#edf3fc; padding:16px; border-radius:8px;">
                                    <!--data labels 1 -->
                                    <tr>
                                       <td class="secondary-text" style="width: 50%; font-size:14px; color:#0B1215;">Date:</td>
                                       <td class="secondary-text" style="width: 50%; font-size:14px; color:#0B1215;">Amount:</td>
                                    </tr>
                                    <!-- data values 1 -->
                                    <tr>
                                       <td class="secondary-text" id="date" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="${date}">EE, MMM dd, yyyy</td>
                                       <td class="secondary-text" id="amount" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="'$' + ${amount} + ' (J)'">$XXX (J)</td>
                                    </tr>
                                    <!-- spacing -->
                                    <tr>
                                        <!-- use &nbsp non-breaking space for empty cell to show -->
                                       <td style="font-size:14px; color:#0B1215;">&nbsp;</td>
                                    </tr>
                                    <!--data labels 2 -->
                                    <tr>
                                       <td class="secondary-text" style="width: 50%; font-size:14px; color:#0B1215;">Status:</td>
                                       <td class="secondary-text" style="width: 50%; font-size:14px; color:#0B1215;">Reference:</td>
                                    </tr>
                                    <!-- data values 2 -->
                                    <tr>
                                       <td class="secondary-text" id="status" style="width: 50%; font-size:14px; color:#BF4342; font-weight:bold;">Expired</td>
                                       <td class="secondary-text" id="reference" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="${reference}">Value</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <!-- Footer -->
                        <tr>
                            <td class="small-text" style="padding-top:24px; font-size: 12px; color: #777; text-align:center;">
                                If you didn't make this transaction, please contact support immediately.
                                <br><br>
                                © 2026 JJBank
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>

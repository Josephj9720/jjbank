<!DOCTYPE html>
<html>
    <body style="margin:0; padding:0; background-color:#DCE8F9; font-family:Arial, Helvetica, sans-serif;">
        <table style="width:100%; padding:20px;">
            <tr>
                <td align="center">
                    <!-- Main Card -->
                    <table style="width:100%; max-width:800px; background-color:#ffffff; border-radius: 12px; padding:32px;">
                        <!-- Header -->
                        <tr>
                            <td style="text-align:center; font-size:22px; font-weight:bold; color:#0B1215">
                                JJBank
                            </td>
                        </tr>
                        <!-- Body -->
                        <tr>
                            <td style="padding-top:16px; font-size:16px; color:#0B1215;">
                                Hello <span th:text="${sender}">Sender</span>,
                                <br><br>
                                Your transfer to <span th:text="${recipient}">Recipient</span> was cancelled.
                            </td>
                        </tr>
                        <!-- Transaction Box -->
                        <tr>
                            <td style="padding-top:16px">
                                <table style="width:100%; background-color:#edf3fc; padding:16px; border-radius:8px;">
                                    <!--data labels 1 -->
                                    <tr>
                                       <td style="width: 50%; font-size:14px; color:#0B1215;">Date:</td>
                                       <td style="width: 50%; font-size:14px; color:#0B1215;">Amount:</td>
                                    </tr>
                                    <!-- data values 1 -->
                                    <tr>
                                        <td id="date" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="${date}">EE, MMM dd, yyyy</td>
                                        <td id="amount" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="'$' + ${amount} + '(J)'">$XXX (J)</td>
                                    </tr>
                                    <!-- spacing -->
                                    <tr>
                                        <!-- use &nbsp non-breaking space for empty cell to show -->
                                       <td style="font-size:14px; color:#0B1215;">&nbsp;</td>
                                    </tr>
                                    <!--data labels 2 -->
                                    <tr>
                                       <td style="width: 50%; font-size:14px; color:#0B1215;">Status:</td>
                                       <td style="width: 50%; font-size:14px; color:#0B1215;">Reference:</td>
                                    </tr>
                                    <!-- data values 2 -->
                                    <tr>
                                       <td id="status" style="width: 50%; font-size:14px; color:#BF4342; font-weight:bold;">Cancelled</td>
                                       <td id="reference" style="width: 50%; font-size:14px; color:#0B1215; font-weight:bold;" th:text="${reference}">Value</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <!-- Footer -->
                        <tr>
                            <td style="padding-top:24px; font-size: 12px; color: #777; text-align:center;">
                                If you didn't make this transaction, please contact support immediately.
                                <br><br>
                                © 2026 JJBank
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
